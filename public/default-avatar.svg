<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0.95"/>
    </radialGradient>
    
    <!-- Stroke Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Animation Styles -->
    <style>
      @keyframes pulseGlow {
        0% { filter: drop-shadow(0 0 10px rgba(99, 102, 241, 0.4)); }
        50% { filter: drop-shadow(0 0 25px rgba(6, 182, 212, 0.7)); }
        100% { filter: drop-shadow(0 0 10px rgba(99, 102, 241, 0.4)); }
      }
      @keyframes floatElement {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(5deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }
      @keyframes floatElementOpposite {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(8px) rotate(-5deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }
      @keyframes rotateRing {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      .main-glow {
        animation: pulseGlow 6s infinite ease-in-out;
      }
      .floater-1 {
        animation: floatElement 5s infinite ease-in-out;
        transform-origin: center;
      }
      .floater-2 {
        animation: floatElementOpposite 6s infinite ease-in-out;
        transform-origin: center;
      }
      .rotating-ring {
        animation: rotateRing 25s infinite linear;
        transform-origin: 200px 200px;
      }
      .rotating-ring-reverse {
        animation: rotateRing 20s infinite linear;
        animation-direction: reverse;
        transform-origin: 200px 200px;
      }
    </style>
  </defs>

  <!-- Background Circle with Border -->
  <rect width="380" height="380" x="10" y="10" rx="60" fill="url(#bgGrad)" stroke="url(#primaryGrad)" stroke-width="4" class="main-glow" />

  <!-- Orbiting Rings -->
  <circle cx="200" cy="200" r="160" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="12 18" opacity="0.25" class="rotating-ring" />
  <circle cx="200" cy="200" r="140" fill="none" stroke="#06b6d4" stroke-width="1" stroke-dasharray="8 25" opacity="0.35" class="rotating-ring-reverse" />

  <!-- Central Monogram Bracket Design -->
  <g>
    <!-- Tech Brackets -->
    <text x="65" y="215" fill="#6366f1" font-family="'Courier New', monospace" font-size="75" font-weight="bold" opacity="0.85" class="floater-1">&lt;</text>
    <text x="300" y="215" fill="#06b6d4" font-family="'Courier New', monospace" font-size="75" font-weight="bold" opacity="0.85" class="floater-2">&gt;</text>
    
    <!-- Central Code Symbol Box -->
    <g class="floater-1" style="animation-delay: -2.5s;">
      <rect x="150" y="105" width="100" height="100" rx="28" fill="none" stroke="url(#primaryGrad)" stroke-width="3" />
      <text x="200" y="170" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="44" font-weight="900" text-anchor="middle">ML</text>
    </g>
  </g>

  <!-- Name / Title Section -->
  <g transform="translate(200, 275)" text-anchor="middle">
    <!-- Main Name -->
    <text x="0" y="0" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900" letter-spacing="1.5">MARIANO LOPEZ</text>
    
    <!-- Subtitle / Role -->
    <text x="0" y="24" fill="#06b6d4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" letter-spacing="4" opacity="0.95">DESARROLLADOR FRONTEND</text>
  </g>

  <!-- Floating Code Snippets / Particles -->
  <g class="floater-2">
    <!-- Small yellow braces / code symbols -->
    <text x="105" y="95" fill="#fbbf24" font-family="monospace" font-size="16" font-weight="bold" opacity="0.6">{ }</text>
    <text x="275" y="295" fill="#a78bfa" font-family="monospace" font-size="15" font-weight="bold" opacity="0.5">div</text>
    <text x="275" y="95" fill="#34d399" font-family="monospace" font-size="15" font-weight="bold" opacity="0.6">const</text>
    <text x="95" y="295" fill="#f87171" font-family="monospace" font-size="16" font-weight="bold" opacity="0.6">=&gt;</text>
  </g>
</svg>
