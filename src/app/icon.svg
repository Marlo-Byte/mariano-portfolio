<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Rounded container representing the Navbar logo box -->
  <rect width="30" height="30" x="1" y="1" rx="8" fill="#0f172a" stroke="#6366f1" stroke-width="1.5" />
  
  <!-- Glowing subtle gradient overlay inside -->
  <circle cx="16" cy="16" r="12" fill="url(#glowGrad)" opacity="0.15" />
  
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  
  <!-- Brackets and Monogram Letter -->
  <g font-family="monospace" font-weight="900" text-anchor="middle">
    <!-- Bracket Left (<) in Indigo -->
    <text x="7" y="21" fill="#6366f1" font-size="11">&lt;</text>
    
    <!-- Monogram Letter (M) in white -->
    <text x="16" y="21" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="900">M</text>
    
    <!-- Bracket Right (>) in Cyan -->
    <text x="25" y="21" fill="#06b6d4" font-size="11">&gt;</text>
  </g>
</svg>
